[project]
name = "docreader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.18"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "ebooklib>=0.18",
    "grpcio>=1.78.0",
    "grpcio-health-checking>=1.78.0",
    "grpcio-tools>=1.78.0",
    "lxml>=6.1.0",
    "markdownify>=0.13.1",
    "markitdown[docx,pdf,xls,xlsx,pptx]>=0.1.3",
    "opendataloader-pdf>=2.4.7",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "xlrd>=2.0.0",
    "pillow>=12.2.0",
    "playwright>=1.55.0",
    "protobuf>=6.33.5",
    "pydantic>=2.13.4",
    "pypdf>=6.13.3",
    "pypdfium2>=5.8.0",
    "python-docx>=1.2.0",
    "requests>=2.33.0",
    "textract==1.5.0",
    "trafilatura>=2.0.0",
]

[tool.uv]
# This project is NOT an installable package — it's a collection of scripts
# run via `python -m docreader.main` with PYTHONPATH pointing to the repo root.
# Setting package = false prevents uv from trying to build/install it (and from
# pulling the unrelated PyPI "docreader" package that shadows local source).
package = false

