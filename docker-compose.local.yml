version: '3.8'

services:
  # 数据库：PostgreSQL + pgvector 向量扩展
  postgres:
    image: pgvector/pgvector:0.7.0-pg16
    container_name: weknora-postgres
    restart: always
    environment:
      POSTGRES_DB: weknora
      POSTGRES_USER: weknora
      POSTGRES_PASSWORD: WeKnora@2024
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weknora -d weknora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 缓存与任务队列：Redis
  redis:
    image: redis:7-alpine
    container_name: weknora-redis
    restart: always
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # WeKnora 主应用（前后端一体化）
  weknora-app:
    image: weknora-app:latest
    container_name: weknora-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: weknora
      DB_USER: weknora
      DB_PASSWORD: WeKnora@2024
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # 系统安全配置（生产环境务必修改）
      SECRET_KEY: your-custom-secret-key-2024
      # 文档解析（默认关闭，需要时开启）
      DOCREADER_ENABLE: "false"
      # 时区
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./data/storage:/app/storage
      - ./data/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/system/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
  redis_data:
